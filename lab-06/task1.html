
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №6 — Завдання 1</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f4f6;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(90%, 850px);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .stage {
            position: relative;
            width: 100%;
            aspect-ratio: 2.6 / 1;
            min-height: 230px;
        }

        .block {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 3px solid #333;
            font-size: clamp(14px, 2vw, 22px);
            padding: 10px;
        }

        /* Два великі блоки */
        .block-left,
        .block-right {
            top: 24%;
            width: 48%;
            height: 58%;
            background: #91cbd8;
            z-index: 1;
        }

        .block-left {
            left: 2%;
        }

        .block-right {
            right: 2%;
        }

        /* Верхній та нижній блоки */
        .block-top,
        .block-bottom {
            left: 23%;
            width: 54%;
            height: 27%;
            background: #0878bd;
            color: white;
            z-index: 2;
        }

        .block-top {
            top: 2%;
        }

        .block-bottom {
            bottom: 2%;
        }

        @media (max-width: 500px) {
            .stage {
                min-height: 190px;
            }

            .block {
                border-width: 2px;
                padding: 4px;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>Завдання 1 — Варіант 7</h1>

        <div class="stage">
            <div class="block block-left">
                Текст всередині блоку
            </div>

            <div class="block block-right">
                Текст всередині блоку
            </div>

            <div class="block block-top">
                Текст всередині блоку
            </div>

            <div class="block block-bottom">
                Текст всередині блоку
            </div>
        </div>
    </main>

</body>
</html>
