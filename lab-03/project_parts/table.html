<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1 — Таблиця</title>
</head>

<body>

<div style="text-align: center;">

    <h1>Завдання 1</h1>

    <table style="
        margin: 0 auto;
        border-collapse: collapse;
        width: 500px;
        height: 500px;
    ">
        <tr>
            <td colspan="7"
                style="border: 2px solid black; background-color: turquoise;">
            </td>
        </tr>

        <tr>
            <td rowspan="5"
                style="border: 2px solid black; background-color: lightyellow;">
            </td>

            <td colspan="5"
                style="border: 2px solid black; background-color: turquoise;">
            </td>

            <td rowspan="5"
                style="border: 2px solid black; background-color: lightyellow;">
            </td>
        </tr>

        <tr>
            <td rowspan="3"
                style="border: 2px solid black; background-color: lightyellow;">
            </td>

            <td colspan="3"
                style="border: 2px solid black; background-color: turquoise;">
            </td>

            <td rowspan="3"
                style="border: 2px solid black; background-color: lightyellow;">
            </td>
        </tr>

        <tr>
            <td rowspan="2"
                style="border: 2px solid black; background-color: lightyellow;">
            </td>

            <td style="border: 2px solid black; background-color: red;"></td>

            <td style="border: 2px solid black; background-color: blue;"></td>
        </tr>

        <tr>
            <td style="border: 2px solid black; background-color: lime;"></td>

            <td style="border: 2px solid black; background-color: yellow;"></td>
        </tr>

        <tr>
            <td colspan="5"
                style="border: 2px solid black; background-color: turquoise;">
            </td>
        </tr>

        <tr>
            <td colspan="7"
                style="border: 2px solid black; background-color: turquoise;">
            </td>
        </tr>
    </table>

    <br>

    <a href="../index.html">Повернутись на головну</a>

</div>

</body>
</html>
